<div class="p-4 border rounded-xl flex items-start space-x-3 shadow-2xs {{ alert_class }} 
    {% if alert_type == 'danger' %}bg-rose-50/40 border-rose-200/80 text-rose-800 dark:bg-rose-950/10 dark:border-rose-900/50 dark:text-rose-400
    {% elif alert_type == 'success' %}bg-emerald-50/40 border-emerald-200/80 text-emerald-800 dark:bg-emerald-950/10 dark:border-emerald-900/50 dark:text-emerald-400
    {% else %}bg-slate-50 border-slate-200 text-slate-800 dark:bg-slate-900 dark:border-slate-800 dark:text-slate-300{% endif %}"
     role="alert">
    <div class="text-sm shrink-0 select-none leading-none">
        {% if alert_type == 'danger' %}🚨{% elif alert_type == 'success' %}✅{% else %}ℹ️{% endif %}
    </div>
    <div class="flex-1 min-w-0">
        {% if alert_title %}<h4 class="text-xs font-bold uppercase tracking-wider mb-0.5">{{ alert_title }}</h4>{% endif %}
        <div class="text-xs leading-relaxed font-medium">
            {{ alert_content }}
        </div>
    </div>
</div>
