
<div class="bg-white border border-slate-200/80 rounded-xl p-5 shadow-2xs overflow-hidden flex flex-col justify-between dark:bg-slate-900 dark:border-slate-800/80 transition-all duration-150">
    <div>
        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 truncate">{{ stat_title }}</p>
        <h3 class="text-2xl font-black tracking-tight mt-2 text-slate-900 dark:text-white">{{ stat_value }}</h3>
    </div>
    {% if stat_change %}
    <div class="flex items-center space-x-1.5 mt-3 text-xs font-bold {% if stat_status == 'positive' %}text-emerald-600 dark:text-emerald-400{% elif stat_status == 'negative' %}text-rose-600 dark:text-rose-400{% else %}text-slate-500{% endif %}">
        <span class="text-[10px]">{% if stat_status == 'positive' %}▲{% elif stat_status == 'negative' %}▼{% else %}●{% endif %}</span>
        <span>{{ stat_change }}</span>
        <span class="text-slate-400 font-medium">vs tracking snapshot</span>
    </div>
    {% endif %}
</div>
