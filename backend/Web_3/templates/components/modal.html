<div x-show="{{ modal_id }}_Open" class="fixed inset-0 z-50 overflow-y-auto animate-fade-in" aria-labelledby="modal-title" role="dialog" aria-modal="true" style="display: none;">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <!-- Backdrop Element Layer transformation framework -->
        <div x-show="{{ modal_id }}_Open" x-transition:enter="transition-opacity ease-out duration-150" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition-opacity ease-in duration-100" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs transition-opacity" @click="{{ modal_id }}_Open = false"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <!-- Structural Modal Card Overlay view window canvas frame node -->
        <div x-show="{{ modal_id }}_Open" x-transition:enter="transition ease-out duration-150 transform" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-100 transform" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="inline-block align-bottom bg-white border border-slate-200/80 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full dark:bg-slate-900 dark:border-slate-800/80">
            <div class="px-6 py-5 border-b border-slate-200/80 dark:border-slate-800/80 flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-900 dark:text-white" id="modal-title">{{ modal_title }}</h3>
                <button type="button" class="text-slate-400 hover:text-slate-500 text-xs focus:outline-none cursor-pointer" @click="{{ modal_id }}_Open = false">✕</button>
            </div>
            <div class="px-6 py-5 text-xs text-slate-600 dark:text-slate-300 leading-relaxed">{{ modal_content }}</div>
            <div class="px-6 py-4 bg-slate-50/50 dark:bg-slate-900/30 border-t border-slate-200/80 dark:border-slate-800/80 flex flex-row-reverse space-x-2 space-x-reverse">
                {{ modal_footer }}
            </div>
        </div>
    </div>
</div>
