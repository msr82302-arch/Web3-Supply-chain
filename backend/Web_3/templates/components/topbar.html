<header class="relative z-10 flex-shrink-0 flex h-16 bg-[#030712] border-b border-slate-800">
    <!-- Responsive Drawer Hamburger Toggle Key Switcher -->
    <button type="button" class="px-4 border-r border-slate-800 text-slate-500 focus:outline-none md:hidden cursor-pointer" @click="mobileSidebarOpen = true">
        <span class="text-xl leading-none">☰</span>
    </button>
    
    <!-- Workspace Actions Control Toolbar Strip Alignment -->
    <div class="flex-1 px-4 flex justify-between sm:px-6 lg:px-8">
        <div class="flex-1 flex items-center">
            <!-- Centralized Search Widget -->
            {% include 'components/search_box.html' %}
        </div>
        <div class="ml-4 flex items-center md:ml-6 space-x-4">
            
            <!-- Dark / Light System Engine Style Preset Toggler -->
            <button type="button" class="p-1.5 rounded-lg border border-slate-800 bg-[#030712] text-slate-400 hover:bg-slate-800 focus:outline-none cursor-pointer">
                <span class="text-xs">🌙</span>
            </button>

            <!-- Multi-point Workspace Notification Stream -->
            {% include 'components/notification_dropdown.html' with unread_count=unread_count alert_logs_list=live_notifications_list %}

            <!-- Dynamic Operator Avatar & dropdown -->
            {% include 'components/avatar.html' %}
            
        </div>
    </div>
</header>
