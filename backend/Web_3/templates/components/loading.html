<div class="flex flex-col items-center justify-center p-8 space-y-3 {{ loading_class }}">
    <div class="relative w-8 h-8">
        <div class="w-8 h-8 rounded-full border-2 border-slate-200 dark:border-slate-800"></div>
        <div class="absolute top-0 left-0 w-8 h-8 rounded-full border-2 border-sky-600 border-t-transparent animate-spin dark:border-sky-500 dark:border-t-transparent"></div>
    </div>
    <p class="text-xs font-semibold text-slate-400 animate-pulse">
        {% if loading_text %}{{ loading_text }}{% else %}Re-indexing layout state parameters...{% endif %}
    </p>
</div>
