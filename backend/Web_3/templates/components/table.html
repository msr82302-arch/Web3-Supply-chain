<div class="flex flex-col">
    <div class="-my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
        <div class="py-2 align-middle inline-block min-w-full sm:px-6 lg:px-8">
            <div class="shadow-2xs overflow-hidden border border-slate-200/80 rounded-xl bg-white dark:border-slate-800/80 dark:bg-slate-900 transition-colors duration-150">
                <table class="min-w-full divide-y divide-slate-200/80 dark:divide-slate-800/80">
                    <thead class="bg-slate-50/70 dark:bg-slate-900/40">
                        <tr class="divide-x divide-slate-200/60 dark:divide-slate-800/60">
                            {{ table_header }}
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200/80 dark:divide-slate-800/80 bg-white dark:bg-slate-900">
                        {{ table_body }}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
