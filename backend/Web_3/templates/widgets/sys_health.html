{# templates/widgets/system_health.html #}
<div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-5 font-mono">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">[NODE_METRICS]</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-950/50 text-emerald-400 border border-emerald-800/60">SYS_OK</span>
    </div>
    <div class="space-y-3 text-xs">
        <div class="flex justify-between">
            <span class="text-slate-500">Gateway Latency:</span>
            <span class="text-sky-400 font-bold">{{ node_sync_latency|default:"0ms" }}</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-500">Pipeline State:</span>
            <span class="text-white font-bold">{{ system_health_status|default:"UNKNOWN" }}</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-500">Database Engine:</span>
            <span class="text-emerald-400 font-bold">PostgreSQL Active</span>
        </div>
    </div>
</div>
